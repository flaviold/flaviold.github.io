<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <script src="js/analytics.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1c1f24;
      --muted: #6a7280;
      --border: #dde1e7;
      --accent: #2563eb;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121418;
        --surface: #1b1e24;
        --text: #e8eaed;
        --muted: #9aa1ad;
        --border: #2e333b;
        --accent: #3b82f6;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 16px 96px; /* bottom room for the fixed footer */
    }

    h1 { margin: 0 0 4px; }
    .muted { color: var(--muted); margin: 0 0 24px; }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .tool {
      display: block;
      height: 100%;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit;
      text-decoration: none;
    }
    .tool:hover, .tool:focus-visible { border-color: var(--accent); }
    .tool h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
    .tool p { margin: 0; color: var(--muted); font-size: 14px; }

    .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    /* Fixed full-width bar; side padding lines the link up with the 800px content column. */
    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 12px max(16px, calc((100% - 800px) / 2 + 16px));
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
    }
    .site-footer a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; }
    .site-footer a:hover, .site-footer a:focus-visible { color: var(--accent); }

    .lang-switch { display: inline-flex; }
    .lang-switch button {
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .lang-switch button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .lang-switch button:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-left: -1px; }
    .lang-switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1 data-i18n="title">Tools</h1>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
    </div>
    <p class="muted" data-i18n="intro">Small browser-based tools. Everything runs in your browser.</p>

    <!-- Add one <li> per tool under /tools/. -->
    <ul class="tools">
      <li>
        <a class="tool" href="tools/vdo-share/" data-umami-event="open-tool" data-umami-event-tool="vdo-share">
          <h2>VDO Share</h2>
          <p data-i18n="vdoShare">Create camera or screen sharing links with VDO.Ninja and show two feeds together on one display page.</p>
        </a>
      </li>
    </ul>

    <footer class="site-footer">
      <a href="https://github.com/flaviold" target="_blank" rel="noopener" data-umami-event="github-link">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span data-i18n="github">flaviold on GitHub</span>
      </a>
    </footer>
  </main>

  <script>
    // Same preference key as the tools (tools/vdo-share/js/i18n.js).
    (function () {
      var LANG_KEY = "siteLang";
      var messages = {
        en: {
          title: "Tools",
          intro: "Small browser-based tools. Everything runs in your browser.",
          vdoShare: "Create camera or screen sharing links with VDO.Ninja and show two feeds together on one display page.",
          github: "flaviold on GitHub",
        },
        pt: {
          title: "Ferramentas",
          intro: "Pequenas ferramentas que rodam inteiramente no seu navegador.",
          vdoShare: "Crie links de compartilhamento de câmera ou tela com o VDO.Ninja e mostre dois feeds juntos em uma página de exibição.",
          github: "flaviold no GitHub",
        },
      };

      function detectLang() {
        try {
          var stored = localStorage.getItem(LANG_KEY);
          if (stored in messages) return stored;
        } catch (e) {}
        var preferred = navigator.languages || [navigator.language || ""];
        return preferred.some(function (l) { return l.toLowerCase().indexOf("pt") === 0; }) ? "pt" : "en";
      }

      function apply(lang) {
        document.documentElement.lang = lang === "pt" ? "pt-BR" : "en-US";
        document.title = messages[lang].title;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = messages[lang][el.dataset.i18n];
        });
        document.querySelectorAll("[data-lang]").forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
        });
      }

      document.querySelectorAll("[data-lang]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (btn.getAttribute("aria-pressed") === "true") return;
          try { localStorage.setItem(LANG_KEY, btn.dataset.lang); } catch (e) {}
          apply(btn.dataset.lang);
          window.siteTrack("language-changed", { lang: btn.dataset.lang });
        });
      });

      apply(detectLang());
    })();
  </script>
</body>
</html>
