<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1c1f24;
      --muted: #6a7280;
      --border: #dde1e7;
      --accent: #2563eb;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121418;
        --surface: #1b1e24;
        --text: #e8eaed;
        --muted: #9aa1ad;
        --border: #2e333b;
        --accent: #3b82f6;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 16px;
    }

    h1 { margin: 0 0 4px; }
    .muted { color: var(--muted); margin: 0 0 24px; }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .tool {
      display: block;
      height: 100%;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit;
      text-decoration: none;
    }
    .tool:hover, .tool:focus-visible { border-color: var(--accent); }
    .tool h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
    .tool p { margin: 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Tools</h1>
    <p class="muted">Small browser-based tools. Everything runs in your browser.</p>

    <!-- Add one <li> per tool under /tools/. -->
    <ul class="tools">
      <li>
        <a class="tool" href="tools/vdo-share/">
          <h2>VDO Share</h2>
          <p>Create camera or screen sharing links with VDO.Ninja and show two feeds together on one display page.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
