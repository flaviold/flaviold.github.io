<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDO Share v2</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="../../js/analytics.js"></script>
</head>
<body class="create-page">
  <div id="app" class="container narrow" v-cloak>
    <header class="page-header">
      <div class="section-title">
        <h1>{{ $t('app.title') }}</h1>
        <div class="row">
          <lang-switch></lang-switch>
          <button type="button" @click="startTour">{{ $t('app.howItWorks') }}</button>
        </div>
      </div>
      <p class="muted">{{ $t('create.intro') }}</p>
    </header>

    <form class="card form" @submit.prevent="start" novalidate>
      <h2>{{ $t('create.title') }}</h2>

      <div class="field" data-tour="nickname">
        <label for="nickname">{{ $t('create.nickname') }}</label>
        <input id="nickname" v-model="nickname" data-demo="nickname" type="text" :maxlength="nicknameMax"
               :placeholder="$t('create.nicknamePlaceholder')" autocomplete="nickname">
      </div>

      <div class="field" data-tour="limit">
        <label for="limit">{{ $t('create.limit') }}</label>
        <div class="stepper">
          <button type="button" data-demo="limit-down" :aria-label="$t('create.decrease')" :disabled="limit <= limitMin" @click="changeLimit(-1)">−</button>
          <input id="limit" v-model.number="limit" type="number" :min="limitMin" :max="limitMax" inputmode="numeric" @change="clampLimit">
          <button type="button" data-demo="limit-up" :aria-label="$t('create.increase')" :disabled="limit >= limitMax" @click="changeLimit(1)">+</button>
        </div>
        <p class="muted small">{{ $t('create.limitHint', { max: limitMax }) }}</p>
        <p v-if="limit > limitWarn" class="warn small">{{ $t('create.limitWarn', { n: limitWarn }) }}</p>
      </div>

      <div class="field" data-tour="password">
        <label for="password">{{ $t('create.password') }}</label>
        <input id="password" v-model="password" data-demo="password" type="password" autocomplete="new-password"
               :placeholder="$t('create.passwordPlaceholder')">
        <p class="muted small">{{ $t('create.passwordHint') }}</p>
      </div>

      <p v-if="error" class="error small" role="alert">{{ $t(error) }}</p>
      <button type="submit" class="primary large" data-tour="start" data-demo="start">{{ $t('create.start') }}</button>
    </form>

    <footer class="site-footer">
      <a href="https://github.com/flaviold" target="_blank" rel="noopener" @click="track('github-link')">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>{{ $t('footer.github') }}</span>
      </a>
    </footer>

    <tour-overlay v-if="tourOpen" :steps="tourSteps" @step="playTourDemo" @close="closeTour"></tour-overlay>
    <svg v-if="tourOpen" class="demo-cursor" :class="{ visible: cursor.visible, clicking: cursor.clicking }"
         :style="{ transform: `translate(${cursor.x}px, ${cursor.y}px)` }"
         width="22" height="26" viewBox="0 0 22 26" aria-hidden="true">
      <path d="M2 2 L2 21 L7 16.5 L10.5 24 L14 22.5 L10.5 15 L17.5 15 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.13/vue.global.prod.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/tour-demo.js"></script>
  <script src="js/create-app.js"></script>
</body>
</html>
